# OMP profile `re-lab`, installed into ~/.omp/profiles/re-lab/agent by runner.py before every job.
# runner.py appends the per-role model pins (every role set to the job's model); none are set here.
# A job never leaves the model it was started with: no fallback chain, no usage-based switching.
retry:
  enabled: true
  modelFallback: false
  usageAwareFallback: false
  fallbackChains:
    default: []
    openai/*: []
    anthropic/*: []
    openrouter/*: []
# The only network route is the model allowlist proxy, so self-update could not work anyway.
update:
  auto: false
# The job directory holds a hostile target: never load MCP servers or context from it, and
# never discover other tools' configuration (omp://settings.md, omp://mcp-config.md).
mcp:
  enableProjectConfig: false
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - gemini
  - opencode
  - github
  - cursor
  - agents
  - agents-md
  - claude-md
  - custom-context
