name: Dependency candidates

on:
  schedule:
    - cron: "23 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Download and verify candidates
        run: python tools/dependency_candidates.py --output "$RUNNER_TEMP/dependency-candidates.json"
      - name: Retain the receipt, not the archives
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-candidates
          path: ${{ runner.temp }}/dependency-candidates.json
          if-no-files-found: error
          retention-days: 14
