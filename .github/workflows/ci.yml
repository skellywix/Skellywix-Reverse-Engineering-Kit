name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run Windows game build contracts
        run: sudo python3 -IB -m unittest discover -s tests -t . -v
      - name: Run passive-inspector contracts
        working-directory: static-inspection
        run: python3 -IB -m unittest discover -s tests -v

  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Byte-compile Python files
        run: python -m compileall -q -f build_desk tests tools static-inspection
