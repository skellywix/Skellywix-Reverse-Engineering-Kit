name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly uncached rebuild: re-downloads and re-verifies every pinned artifact.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-dev.txt
      - name: Run unit tests as root
        # sudo resets PATH, so name the interpreter setup-python installed.
        run: |
          python -VV
          sudo "$(command -v python)" -m unittest discover -s tests -t . -v

  host-python:
    name: Unit tests (distribution python3, as the systemd units run it)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests as root with /usr/bin/python3
        run: |
          /usr/bin/python3 -VV
          sudo /usr/bin/python3 -m unittest discover -s tests -t .

  lint:
    name: Lint and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked lint tools
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements-ci.txt
      - name: Ruff (undefined names, unused imports, syntax errors)
        run: ruff check --isolated --select F,E9 container tests
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github/workflows
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: container/Dockerfile
          # Immutable apt snapshot and hash-locked Python inputs are pinned without inline
          # package versions; the checksum pipe ends in strict sha256 verification.
          ignore: DL3008,DL3013,DL4006
          failure-threshold: warning
      - name: Validate the Compose model
        run: docker compose -f container/compose.yaml config --quiet
      - name: Verify the systemd units
        run: systemd-analyze verify --man=no container/*.service
      - name: Byte-compile Python files
        run: python -m py_compile $(find container tests -type f -name '*.py' -print)

  image:
    name: Image build (${{ matrix.image }})
    needs: [unit, host-python, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        image: [agent, exec, egress]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./container
          file: ./container/Dockerfile
          target: ${{ matrix.image }}
          push: false
          tags: re-lab-${{ matrix.image }}:ci
          # Only the small egress image is loaded, to parse its proxy configuration.
          outputs: ${{ matrix.image == 'egress' && 'type=docker' || 'type=cacheonly' }}
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Parse the egress proxy configuration inside the image
        if: matrix.image == 'egress'
        run: docker run --rm --network none --entrypoint squid re-lab-egress:ci -k parse -f /etc/squid/squid.conf
